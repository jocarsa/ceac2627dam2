<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Componentes HTML</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <h1>Componentes estándar de HTML</h1>


    <section>

        <h2>Entrada de datos</h2>

        <label>
            Nombre:
            <input type="text">
        </label>

        <label>
            Contraseña:
            <input type="password">
        </label>

        <label>
            Edad:
            <input type="number">
        </label>

    </section>


    <section>

        <h2>Selección</h2>

        <label>
            <input type="checkbox">
            Acepto las condiciones
        </label>

        <label>
            Ciudad:

            <select>
                <option>Valencia</option>
                <option>Madrid</option>
                <option>Barcelona</option>
            </select>
        </label>

    </section>


    <section>

        <h2>Componentes especiales</h2>

        <label>
            Fecha:
            <input type="date">
        </label>

        <label>
            Color:
            <input type="color">
        </label>

        <label>
            Volumen:
            <input type="range" min="0" max="100">
        </label>

    </section>


    <section>

        <h2>Acciones e información</h2>

        <button>Guardar</button>

        <p>Progreso:</p>

        <progress value="70" max="100"></progress>

    </section>

</body>

</html>
