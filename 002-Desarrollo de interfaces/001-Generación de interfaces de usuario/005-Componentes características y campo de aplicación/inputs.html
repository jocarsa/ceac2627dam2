<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Entrada de datos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        label {
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h1>Entrada de datos</h1>

    <label>
        Nombre:
        <input type="text">
    </label>

    <label>
        Contraseña:
        <input type="password">
    </label>

    <label>
        Correo:
        <input type="email">
    </label>

    <label>
        Edad:
        <input type="number">
    </label>

    <label>
        Fecha de nacimiento:
        <input type="date">
    </label>

    <label>
        Comentarios:
        <br>
        <textarea rows="5" cols="40"></textarea>
    </label>

</body>

</html>
