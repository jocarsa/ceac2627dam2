<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Valores numéricos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        label {
            display: block;
            margin: 20px 0;
        }
    </style>
</head>

<body>

    <h1>Valores numéricos</h1>

    <label>
        Edad:
        <input type="number"
               min="0"
               max="120">
    </label>


    <label>
        Volumen:
        <input type="range"
               min="0"
               max="100">
    </label>

</body>

</html>
