<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tabla de productos</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 10px;
        }

    </style>
</head>

<body>

    <h1>Productos</h1>


    <table>

        <thead>

            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>

        </thead>


        <tbody>

            <tr>
                <td>Teclado</td>
                <td>79 €</td>
                <td>12</td>
            </tr>

            <tr>
                <td>Ratón</td>
                <td>45 €</td>
                <td>8</td>
            </tr>

            <tr>
                <td>Monitor</td>
                <td>220 €</td>
                <td>4</td>
            </tr>

        </tbody>

    </table>

</body>

</html>
