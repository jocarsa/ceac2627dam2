<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Componentes de selección</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <h1>Componentes de selección</h1>


    <section>

        <h2>Checkbox</h2>

        <label>
            <input type="checkbox">
            Recibir notificaciones
        </label>

    </section>


    <section>

        <h2>Varios checkbox</h2>

        <label>
            <input type="checkbox">
            Cine
        </label>

        <label>
            <input type="checkbox">
            Música
        </label>

        <label>
            <input type="checkbox">
            Videojuegos
        </label>

    </section>


    <section>

        <h2>Radio buttons</h2>

        <label>
            <input type="radio" name="turno">
            Mañana
        </label>

        <label>
            <input type="radio" name="turno">
            Tarde
        </label>

        <label>
            <input type="radio" name="turno">
            Noche
        </label>

    </section>


    <section>

        <h2>Lista desplegable</h2>

        <label>
            Provincia:

            <select>
                <option>Valencia</option>
                <option>Alicante</option>
                <option>Castellón</option>
            </select>

        </label>

    </section>

</body>

</html>
