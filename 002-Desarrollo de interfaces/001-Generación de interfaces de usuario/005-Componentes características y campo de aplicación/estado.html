<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estado de componentes</title>
</head>

<body>

    <h1>Estado de componentes</h1>


    <p>
        <input
            type="text"
            value="No se puede editar"
            disabled
        >
    </p>


    <p>
        <label>
            <input
                type="checkbox"
                checked
            >

            Opción seleccionada
        </label>
    </p>


    <p>

        <select>

            <option>Valencia</option>

            <option selected>
                Alicante
            </option>

            <option>Castellón</option>

        </select>

    </p>


    <p>

        <button disabled>
            Guardar
        </button>

    </p>

</body>

</html>
