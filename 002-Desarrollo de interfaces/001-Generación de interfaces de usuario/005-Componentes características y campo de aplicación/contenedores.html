<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Estructura semántica</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header,
        nav,
        main,
        footer {
            padding: 20px;
        }

        nav a {
            margin-right: 15px;
        }

        article {
            border: 1px solid #999;
            padding: 15px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>


    <header>

        <h1>Mi tienda</h1>

    </header>


    <nav>

        <a href="#">Inicio</a>
        <a href="#">Productos</a>
        <a href="#">Contacto</a>

    </nav>


    <main>

        <section>

            <h2>Productos</h2>


            <article>

                <h3>Teclado</h3>

                <p>
                    Teclado mecánico.
                </p>

                <button>
                    Comprar
                </button>

            </article>


            <article>

                <h3>Ratón</h3>

                <p>
                    Ratón inalámbrico.
                </p>

                <button>
                    Comprar
                </button>

            </article>

        </section>

    </main>


    <footer>

        <p>
            Mi tienda - 2026
        </p>

    </footer>


</body>

</html>
