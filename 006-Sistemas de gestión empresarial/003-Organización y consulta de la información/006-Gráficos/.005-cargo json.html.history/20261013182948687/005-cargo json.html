<!doctype html>
<html>
  <head>
    <style>
      #contenedor{display:flex;align-items:flex-end;}
      .barra{background:blue;width:20px;border-radius:5px;margin:1px;
      color:white;padding:10px;}
    </style>
  </head>
  <body>
    <div id="contenedor"></div>
    <script>
      let datos = [
        {"leyenda":"valor1","valor":30},
        {"leyenda":"valor2","valor":50},
        {"leyenda":"valor3","valor":90},
        {"leyenda":"valor4","valor":60}
      ];
      let contenedor = document.querySelector("#contenedor")
      datos.forEach(function(dato){
      	contenedor.innerHTML += `
        	<div class="barra" style="height:`+dato.valor+`px;">
      			`+dato.leyenda+`
      		</div>`;
      })
    </script>
  </body>
</html>
