<!doctype html>
<html>
  <head>
    <style>
      .barra{background:blue;height:20px;}
    </style>
  </head>
  <body>
    <div id="contenedor"></div>
    <script>
      let datos = [34,65,76,87,54,34,43];
      let contenedor = document.querySelector("#contenedor")
      datos.forEach(function(dato){
      	contenedor.innerHTML += '<div class="barra" style="'+dato+'"></div>';
      })
    </script>
  </body>
</html>
