<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universo de entidades</title><link rel="stylesheet" href="style.css"></head><body><header><strong>◉ Universo de entidades</strong><div class="actions"><div class="projects"><label for="projectSelect">Proyecto</label><select id="projectSelect" aria-label="Proyecto activo"></select><button id="newProject" title="Crear proyecto">+ Proyecto</button><button id="renameProject" title="Renombrar proyecto">Renombrar</button><button id="deleteProject" title="Eliminar proyecto">Eliminar proyecto</button></div><button id="add">+ Entidad</button><button id="fit">Centrar vista</button><button id="export">Exportar JSON</button><button id="exportSql">Exportar SQL</button><label class="import">Importar<input type="file" id="import" accept="application/json" hidden></label><button id="clear">Limpiar</button><small id="syncStatus">Conectando…</small></div></header><main id="viewport"><div id="world"><svg id="categoriesLayer"></svg><svg id="wires"></svg><div id="nodes"></div></div><div class="hint">Crea entidades y arrastra entre conectores de propiedades para relacionarlas</div></main><dialog id="editor"><form method="dialog" id="entityForm"><h2 id="formTitle">Entidad</h2><label>Título<input id="title" required maxlength="80"></label><label>Categorías <small>(separadas por comas; admite varias categorías)</small><input id="categories" placeholder="Ventas, CRM, Finanzas"></label><label>Propiedades <small>(una por línea, por ejemplo id: INTEGER(11))</small><textarea id="properties" rows="8" placeholder="id: integer&#10;nombre: texto"></textarea></label><div class="buttons"><button type="button" id="deleteEntity" class="danger">Eliminar entidad</button><span></span><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary">Guardar</button></div></form></dialog><dialog id="dataDialog" class="data-dialog"><div class="data-top"><div><h2 id="dataTitle">Registros</h2><small id="dataCount"></small></div><button type="button" id="closeData">Cerrar ✕</button></div><div class="data-scroll"><table id="dataTable"><thead></thead><tbody></tbody></table></div><div class="data-bottom"><button id="addRow" class="primary">+ Añadir registro</button><small>Los cambios se guardan automáticamente en este proyecto.</small></div></dialog><script src="app.js"></script></body></html>
