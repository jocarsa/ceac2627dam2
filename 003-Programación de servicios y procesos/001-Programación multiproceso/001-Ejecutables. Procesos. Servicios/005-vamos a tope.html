      let trabajadores = []; 	// Array vacío

      // Recorro el array y añado nuevos workers (creo instancia)
      for(let i = 0;i<numerotrabajadores;i++){
      	trabajadores.push(new Worker("trabajador3.js"))
      }
      // Recorro el array y a cada worker le lanzo una bienvenida
      for(let i = 0;i<numerotrabajadores;i++){
      	trabajadores[i].postMessage("hola");
      }
      // Recorro el array para escuchar cuando acaben
      for(let i = 0;i<numerotrabajadores;i++){

          console.log("El trabajador me ha respondido")
        }
