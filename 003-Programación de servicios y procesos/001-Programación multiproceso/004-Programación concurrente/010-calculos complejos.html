<!doctype html>
<html>
<head>
<meta charset="utf-8">

<style>

html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#111;
}

canvas{
    display:block;
}

#info{
    position:fixed;
    top:10px;
    left:10px;

    color:white;
    font-family:monospace;
    font-size:14px;

    background:rgba(0,0,0,0.6);
    padding:10px;

    pointer-events:none;
}

</style>
</head>

<body>

<canvas></canvas>

<div id="info">
    Iniciando...
</div>

<script>

// ============================================================
// CONFIGURACIÓN
// ============================================================

const NUMERO_BICHITOS = 5000;
const NUMERO_WORKERS = 12;

const RADIO_MIN = 2;
const RADIO_MAX = 4;

const VELOCIDAD_MIN = 0.5;
const VELOCIDAD_MAX = 2;


// Tamaño de cada celda espacial.
//
// Debe ser al menos aproximadamente el diámetro máximo.
// Lo hacemos algo mayor para reducir problemas de frontera.

const TAMANO_CELDA = RADIO_MAX * 2;


// ============================================================
// CANVAS
// ============================================================

const lienzo =
    document.querySelector("canvas");

const contexto =
    lienzo.getContext("2d");

const info =
    document.querySelector("#info");


let anchura =
    window.innerWidth;

let altura =
    window.innerHeight;


lienzo.width =
    anchura;

lienzo.height =
    altura;


// ============================================================
// MEMORIA COMPARTIDA
// ============================================================
//
// Cada partícula tiene:
//
// x
// y
// vx
// vy
// radio
//
// Usaremos velocidad cartesiana internamente.
//
// El ángulo se convierte inicialmente mediante:
//
// vx = cos(angulo) * velocidad
// vy = sin(angulo) * velocidad
//
// ============================================================

const DATOS_POR_BICHITO = 5;

const TAMANO_FLOAT =
    Float32Array.BYTES_PER_ELEMENT;


const bufferParticulas =
    new SharedArrayBuffer(
        NUMERO_BICHITOS *
        DATOS_POR_BICHITO *
        TAMANO_FLOAT
    );


const particulas =
    new Float32Array(
        bufferParticulas
    );


// ============================================================
// COLORES
// ============================================================
//
// Los colores no necesitan ser modificados por workers.
// Por tanto NO necesitan SharedArrayBuffer.
//
// ============================================================

const colores =
    new Uint8Array(
        NUMERO_BICHITOS * 3
    );


// ============================================================
// ÍNDICES
// ============================================================

function indice(i){

    return i *
        DATOS_POR_BICHITO;

}


// ============================================================
// CREAR BICHITOS
// ============================================================

for(
    let i = 0;
    i < NUMERO_BICHITOS;
    i++
){

    const base =
        indice(i);


    const radio =
        RADIO_MIN +
        Math.random() *
        (RADIO_MAX - RADIO_MIN);


    const angulo =
        Math.random() *
        Math.PI * 2;


    const velocidad =
        VELOCIDAD_MIN +
        Math.random() *
        (
            VELOCIDAD_MAX -
            VELOCIDAD_MIN
        );


    particulas[base] =
        radio +
        Math.random() *
        (
            anchura -
            radio * 2
        );


    particulas[base+1] =
        radio +
        Math.random() *
        (
            altura -
            radio * 2
        );


    // ----------------------------------------
    // ÁNGULO -> VECTOR
    // ----------------------------------------

    particulas[base+2] =
        Math.cos(angulo) *
        velocidad;


    particulas[base+3] =
        Math.sin(angulo) *
        velocidad;


    particulas[base+4] =
        radio;


    // ----------------------------------------
    // COLOR
    // ----------------------------------------

    colores[i*3] =
        Math.random()*256;

    colores[i*3+1] =
        Math.random()*256;

    colores[i*3+2] =
        Math.random()*256;

}


// ============================================================
// CREAR WORKERS
// ============================================================

const workers = [];

let workersTerminados = 0;

let frame = 0;

let fps = 0;

let ultimoFPS =
    performance.now();

let framesFPS = 0;


// ============================================================
// DIVIDIR TRABAJO
// ============================================================

const cantidadPorWorker =
    Math.ceil(
        NUMERO_BICHITOS /
        NUMERO_WORKERS
    );


for(
    let w = 0;
    w < NUMERO_WORKERS;
    w++
){

    const inicio =
        w *
        cantidadPorWorker;


    const fin =
        Math.min(
            inicio +
            cantidadPorWorker,

            NUMERO_BICHITOS
        );


    const worker =
        new Worker(
            "workerbichitos.js"
        );


    worker.onmessage =
        function(evento){

            if(
                evento.data.tipo ===
                "listo"
            ){

                workersTerminados++;


                if(
                    workersTerminados ===
                    NUMERO_WORKERS
                ){

                    pintar();

                    calcularFPS();

                    requestAnimationFrame(
                        siguienteFrame
                    );

                }

            }

        };


    worker.postMessage({

        tipo:"inicializar",

        buffer:
            bufferParticulas,

        numero:
            NUMERO_BICHITOS,

        inicio:
            inicio,

        fin:
            fin,

        anchura:
            anchura,

        altura:
            altura,

        tamanoCelda:
            TAMANO_CELDA,

        datosPorBichito:
            DATOS_POR_BICHITO

    });


    workers.push(
        worker
    );

}


// ============================================================
// SIGUIENTE FRAME
// ============================================================

function siguienteFrame(){

    workersTerminados = 0;

    frame++;


    for(
        let i = 0;
        i < workers.length;
        i++
    ){

        workers[i].postMessage({

            tipo:"calcular",

            frame:frame

        });

    }

}


// ============================================================
// PINTAR
// ============================================================

function pintar(){

    contexto.clearRect(
        0,
        0,
        anchura,
        altura
    );


    /*
        Para 50.000 partículas:

        hacer beginPath + arc + fill
        individualmente es caro.

        Agrupamos por color aproximado
        para reducir cambios de estado.

        Pero para mantener el ejemplo
        sencillo usamos rectángulos.

        La física sigue usando círculos.
    */


    for(
        let i = 0;
        i < NUMERO_BICHITOS;
        i++
    ){

        const base =
            indice(i);


        const x =
            particulas[base];

        const y =
            particulas[base+1];

        const radio =
            particulas[base+4];


        const r =
            colores[i*3];

        const g =
            colores[i*3+1];

        const b =
            colores[i*3+2];


        contexto.fillStyle =
            "rgb("+
            r+","+
            g+","+
            b+
            ")";


        contexto.fillRect(

            x-radio,
            y-radio,

            radio*2,
            radio*2

        );

    }

}


// ============================================================
// FPS
// ============================================================

function calcularFPS(){

    framesFPS++;

    const ahora =
        performance.now();


    if(
        ahora -
        ultimoFPS >=
        1000
    ){

        fps =
            framesFPS;


        framesFPS = 0;

        ultimoFPS =
            ahora;


        info.innerHTML =
            "Bichitos: " +
            NUMERO_BICHITOS +
            "<br>" +

            "Workers: " +
            NUMERO_WORKERS +
            "<br>" +

            "FPS: " +
            fps;

    }

}


// ============================================================
// REDIMENSIONAR
// ============================================================

window.addEventListener(
    "resize",
    function(){

        anchura =
            window.innerWidth;

        altura =
            window.innerHeight;


        lienzo.width =
            anchura;

        lienzo.height =
            altura;


        for(
            let worker of workers
        ){

            worker.postMessage({

                tipo:"resize",

                anchura:
                    anchura,

                altura:
                    altura

            });

        }

    }
);


// ============================================================
// ARRANCAR
// ============================================================

siguienteFrame();

</script>

</body>
</html>
